<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>講座互動指南</title><style>body{margin:16px auto;max-width:1120px;padding:0 12px;font-family:system-ui}button,input,select{font:inherit}button{cursor:pointer} .viz-carousel section[hidden]{display:none}#gear{position:absolute;right:24px;top:12px;z-index:4}#editor{padding:16px;background:#eef5f3;color:#203c43}#editor fieldset{margin:12px 0;border:1px solid #acc6c0}#editor label{display:block;margin:8px 0}.field{background:white;border:1px solid #acc6c0;padding:8px;min-height:24px}#bar{position:sticky;top:0;background:#eef5f3;padding:8px;z-index:5;display:flex;gap:5px;flex-wrap:wrap}</style><script>(function(root,factory){
 if(typeof module==='object'&&module.exports)module.exports=factory();
 else root.GuideSections=factory();
})(globalThis,function(){
 function read(page){
  const length=page.items.length;
  let list;
  if(Array.isArray(page.sectionLayout)&&page.sectionLayout.length){
   list=page.sectionLayout.map(entry=>({...entry}));
  }else{
   list=Object.entries(page.sectionTitles||{})
    .map(([start,title])=>({id:'legacy-'+start,start:Number(start),title,columns:page.sectionColumns?.[start]}))
    .filter(entry=>Number.isInteger(entry.start)&&entry.start>=0&&entry.start<=length)
    .sort((a,b)=>a.start-b.start);
  }
  if(!list.length||list[0].start!==0)list.unshift({id:'page-start',start:0,title:null});
  return list.map((entry,index)=>({...entry,end:list[index+1]?.start??length,count:(list[index+1]?.start??length)-entry.start}));
 }
 function ensure(page){
  if(!Array.isArray(page.sectionLayout)||!page.sectionLayout.length)page.sectionLayout=read(page).map(({end,count,...entry})=>entry);
  return page.sectionLayout;
 }
 function project(page){
  page.sectionTitles={};page.sectionColumns={};
  for(const entry of ensure(page))if(entry.title!==null){
   page.sectionTitles[entry.start]=entry.title;
   if(entry.columns!==undefined)page.sectionColumns[entry.start]=entry.columns;
  }
 }
 function find(page,id){return read(page).find(entry=>entry.id===id);}
 function forCard(page,index){
  if(index<0||index>=page.items.length)return undefined;
  return read(page).find(entry=>index>=entry.start&&index<entry.end);
 }
 function insert(page,id,card,position){
  const list=ensure(page),section=find(page,id),sectionIndex=list.findIndex(entry=>entry.id===id);
  if(!section||sectionIndex<0)throw new Error('分區已變更，請重新選取分區。');
  const at=position??section.end;
  if(!Number.isInteger(at)||at<section.start||at>section.end)throw new Error('新增位置不在選取的分區。');
  page.items.splice(at,0,card);
  for(let i=sectionIndex+1;i<list.length;i++)list[i].start++;
  project(page);return at;
 }
 function remove(page,index){
  const section=forCard(page,index);
  if(!section)throw new Error('找不到要刪除的卡片。');
  const list=ensure(page),sectionIndex=list.findIndex(entry=>entry.id===section.id);
  const [card]=page.items.splice(index,1);
  for(let i=sectionIndex+1;i<list.length;i++)list[i].start--;
  project(page);return {sectionId:section.id,card};
 }
 function duplicate(page,index){
  const section=forCard(page,index);
  if(!section)throw new Error('找不到要複製的卡片。');
  return insert(page,section.id,structuredClone(page.items[index]),index+1);
 }
 function update(page,id,changes){
  const entry=ensure(page).find(item=>item.id===id);
  if(!entry)throw new Error('找不到分區。');
  Object.assign(entry,changes);
  if(entry.title===null&&changes.columns!==undefined){page.columns=changes.columns;delete entry.columns;}
  project(page);
 }
 function addHeading(page,start,title){
  const list=ensure(page);
  if(!Number.isInteger(start)||start<0||start>page.items.length)throw new Error('分區位置無效。');
  let suffix=1;while(list.some(entry=>entry.id==='section-'+suffix))suffix++;
  const entry={id:'section-'+suffix,start,title};
  const next=list.findIndex(item=>item.start>start);
  list.splice(next<0?list.length:next,0,entry);project(page);return entry.id;
 }
 function removeHeading(page,id){
  const list=ensure(page),index=list.findIndex(entry=>entry.id===id);
  if(index<0)return;
  if(index===0){list[0].title=null;delete list[0].columns;}
  else list.splice(index,1);
  project(page);
 }
 return {read,find,forCard,insert,remove,duplicate,update,addHeading,removeHeading};
});

 grid.innerHTML=visible.map(a=>'<article><span class="lg-tag">'+a[1]+'</span><h3><a class="lg-tool-title" href="'+a[3]+'" target="_blank" rel="noopener noreferrer">'+a[0]+'</a></h3><p class="lg-description">'+a[2]+'</p></article>').join('');
 live.textContent=category+' · '+visible.length+' 個工具';grid.querySelectorAll('article').forEach((card,i)=>card.dataset.tool=tools.indexOf(visible[i]));bindCardFocus();apply();document.dispatchEvent(new Event('guide-rendered'));return;}

 grid.innerHTML=items.map((a,index)=>desktopHeading(page,index)+'<article>'+taskToolLine(a)+'<h3>'+a[1]+'</h3>'+cardBody(a)+(a[7]===false?'':'<div class="lg-actions"><button type="button" class="lg-secondary" data-copy>'+config.labels.copy+'</button></div>')+'</article>').join('')+desktopHeading(page,items.length);
 grid.querySelectorAll('details').forEach(details=>{
 const summary=details.querySelector('summary'),content=details.querySelector('.lg-prompt');
 let motion=null,fade=null,intendedOpen=details.open;

 details.addEventListener('toggle',label);label();
 summary.addEventListener('click',event=>{
 event.preventDefault();
 const opening=motion?!intendedOpen:!details.open;intendedOpen=opening;
 const start=details.offsetHeight;
 if(motion){motion.onfinish=null;motion.cancel();motion=null;}if(fade){fade.cancel();fade=null;}
 details.style.height='';details.style.overflow='';
 if(window.matchMedia('(prefers-reduced-motion: reduce)').matches||!details.animate){details.open=opening;label();return;}
 let end;
 if(opening){details.open=true;end=details.offsetHeight;}else{details.open=false;end=details.offsetHeight;details.open=true;}
 details.style.height=start+'px';details.style.overflow='hidden';
 const current=details.animate([{height:start+'px'},{height:end+'px'}],{duration:opening?160:130,easing:'cubic-bezier(.2,.8,.25,1)',fill:'both'});motion=current;
 if(opening){fade=content.animate([{opacity:.5,transform:'translateY(-3px)'},{opacity:1,transform:'translateY(0)'}],{duration:140,easing:'ease-out'});}
 current.onfinish=()=>{if(motion!==current)return;details.open=opening;details.style.height='';details.style.overflow='';current.cancel();motion=null;label();};
 });
 });
 grid.querySelectorAll('article').forEach((card,i)=>{const b=card.querySelector('[data-copy]');if(b)b.onclick=async()=>{try{await navigator.clipboard.writeText(items[i][5]);live.textContent='範例已複製。'}catch{const details=card.querySelector('details');if(details)details.open=true;live.textContent='請選取展開的範例文字後複製。'}};});
 if(focus){const s=root.querySelector('.lg-stepnav');s.innerHTML='<button type="button" class="lg-secondary" data-prev '+(step===0?'disabled':'')+'>← 上一任務</button><span>'+ (step+1)+' / '+groups[group].items.length+'</span><button type="button" class="lg-secondary" data-next '+(step===groups[group].items.length-1?'disabled':'')+'>下一任務 →</button>';s.querySelector('[data-prev]').onclick=()=>{step--;render()};s.querySelector('[data-next]').onclick=()=>{step++;render()};}
 grid.querySelectorAll('article').forEach((card,i)=>card.dataset.card=i);

 headings.forEach(heading=>{

 });

}
})();
